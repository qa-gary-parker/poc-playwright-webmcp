name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Benchmark (N=50) into a scratch folder
        run: OUT=ci-results N=50 node src/bench.mjs > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci-results/
